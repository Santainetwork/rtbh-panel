# RTBH Panel - Complete Configuration Reference
# Copy to a private deployment location (e.g. /etc/rtbh-panel/config.yaml or use flags/env).

# --- Identity & BGP Settings ---
local_asn: 65000                        # Local Autonomous System Number (ASN)
router_id: "192.0.2.1"                  # BGP Router ID (IPv4 format)
bgp_listen: "127.0.0.1:4179"            # Port 179 for production (requires root/CAP_NET_BIND_SERVICE)
listen_ranges:                          # Accepted peer CIDRs (learned dynamically)
  - "127.0.0.1/32"
  - "192.0.2.0/24"
allowed_asns:                           # Allowed remote peer ASNs (omit to allow any ASN within listen_ranges)
  - 64512
  - 64513
max_sessions: 32                        # Maximum concurrent dynamic BGP sessions
peer_group: "rtbh-dynamic"

# Next-Hop overrides for RTBH advertisements
rtbh_next_hop_v4: "192.0.2.1"           # IPv4 Next-Hop (defaults to router_id if omitted)
rtbh_next_hop_v6: "::1"                 # IPv6 Next-Hop (defaults to ::1 if omitted)

# --- Web Dashboard & API ---
http_listen: "127.0.0.1:8080"           # Set to 0.0.0.0:8080 for remote access (requires insecure_listen: true)
insecure_listen: false                  # Allow non-loopback HTTP/sync listen without TLS (set true if on VPS without reverse proxy)

# --- Policy Sync & Agent RPC ---
sync_listen: "127.0.0.1:17900"          # Policy-sync server listen address
sync_server: "127.0.0.1:17900"          # Target address used by rtbh-agent to connect
max_message_bytes: 1048576              # Maximum framed message size (1 MiB)
max_in_flight: 16                       # Maximum unacknowledged streaming messages
reconnect_min: "250ms"                  # Agent reconnect backoff minimum
reconnect_max: "5s"                     # Agent reconnect backoff maximum

# --- Safety & Operating Mode ---
dry_run: true                           # Default true (safe mode). Set false to allow real BGP announcement & web apply
policy_file: "/etc/rtbh-panel/policy.json" # Persistent JSON file for stored blocklist/whitelist
cursor_file: "/var/run/rtbh-agent.cursor"  # Agent stream offset tracking file
shutdown_timeout: "5s"                  # Graceful shutdown timeout
default_action: reject                  # Unmatched traffic default action

# --- High-Performance Database Backend (SQL: SQLite / MySQL / PostgreSQL) ---
# Recommended for feeds with thousands to millions of IPs (prevents high CPU and UI unresponsiveness).
# Supported drivers: "sqlite" (default pure-Go), "postgres", "mysql".
db_driver: "sqlite"                     # "sqlite", "postgres", or "mysql" (CLI: --db-driver, ENV: RTBH_DB_DRIVER)
db_dsn: "/var/lib/rtbh-panel/policy.db" # Database path or connection URI (CLI: --db-dsn, ENV: RTBH_DB_DSN)
# PostgreSQL Example:
#   db_driver: "postgres"
#   db_dsn: "postgres://user:password@127.0.0.1:5432/rtbh?sslmode=disable"
# MySQL / MariaDB Example:
#   db_driver: "mysql"
#   db_dsn: "user:password@tcp(127.0.0.1:3306)/rtbh?parseTime=true"

# --- External Feeds (Pastebin / URL / Text File Sync) ---
# Automatically download and sync list of IPs/CIDRs from external URL or local file:
blocklist_feed: "https://pastebin.com/raw/example-blocklist" # URL or file path (1 IP/CIDR per line)
whitelist_feed: "https://pastebin.com/raw/example-whitelist" # URL or file path (1 IP/CIDR per line)
feed_interval: "15m"                    # Sync interval (e.g. 10m, 1h). Set 0 to fetch only once on startup
whitelist_expand_subnets: true          # Expand subnets (/16 to /24) in whitelist into individual /32 host entries
